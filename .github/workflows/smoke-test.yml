name: Hash Race multi-language smoke test

on:
  push:
  pull_request:

jobs:
  godot-world-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Boot and parse live Godot world
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path Godot --quit-after 3 2>&1 | tee /tmp/hashrace-setup.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-setup.log
          godot --headless --path Godot --script res://scripts/validate_modular_scripts.gd
          godot --headless --path Godot res://scenes/world.tscn --quit-after 3 2>&1 | tee /tmp/hashrace-world.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-world.log
          godot --headless --path Godot --script res://scripts/validate_overworld.gd

  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Core and v0.129 gameplay contracts
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for contract in \
            tools/smoke_test.py \
            tools/test_league_contract.py \
            tools/test_life_ops_contract.py \
            tools/test_energy_visual_contract.py \
            tools/test_v129_capacity_decision_contract.py
          do
            echo "::group::CONTRACT $contract"
            if python "$contract"; then
              echo "PASS: $contract"
            else
              status=$?
              echo "::error title=Hash Race contract failed::$contract exited with status $status"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  cpp-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run C++ simulation checks
        run: >-
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic
          native/cpp/hashrace_catalog.cpp native/cpp/hashrace_simulation.cpp native/cpp/hashrace_core.cpp
          -o /tmp/hashrace_cpp && /tmp/hashrace_cpp
      - name: Compile and run v0.128 road/container contract
        run: >-
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic
          native/cpp/v128_road_container_contract.cpp
          -o /tmp/hashrace_v128_contract && /tmp/hashrace_v128_contract

  rust-balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Rust balance tests
        run: rustc --edition=2021 --test native/rust/hashrace_balance.rs -o /tmp/hashrace_rust_tests && /tmp/hashrace_rust_tests

  typescript-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save typescript@5.8.3
      - run: npx tsc tools/typescript/hashrace_validate.ts --target ES2020 --module commonjs --strict --outDir .tmp-ts && node .tmp-ts/hashrace_validate.js
