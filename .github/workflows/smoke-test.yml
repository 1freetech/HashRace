name: Hash Race multi-language smoke test

on:
  push:
  pull_request:

jobs:
  godot-world-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4
      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Boot opening campaign setup with strict script-error gate
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path Godot --quit-after 3 2>&1 | tee /tmp/hashrace-setup.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-setup.log; then exit 1; fi
      - name: Validate live campaign character preview
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path Godot --script res://scripts/validate_campaign_setup.gd 2>&1 | tee /tmp/hashrace-campaign-preview.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|HASH RACE CAMPAIGN SETUP FAIL" /tmp/hashrace-campaign-preview.log; then exit 1; fi
      - name: Parse pixel landscape directly
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path Godot res://scenes/pixel_landscape_probe.tscn --quit-after 1 2>&1 | tee /tmp/hashrace-pixel-probe.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-pixel-probe.log; then exit 1; fi
      - name: Parse v0.072 modular scripts directly
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path Godot --script res://scripts/validate_modular_scripts.gd 2>&1 | tee /tmp/hashrace-modular-parse.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|MODULAR PARSE FAIL" /tmp/hashrace-modular-parse.log; then exit 1; fi
      - name: Validate v0.072 negotiation scene directly
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path Godot --script res://scripts/validate_negotiation_scene.gd 2>&1 | tee /tmp/hashrace-negotiation-validate.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|HASH RACE NEGOTIATION FAIL" /tmp/hashrace-negotiation-validate.log; then exit 1; fi
      - name: Boot real company town network with strict script-error gate
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path Godot res://scenes/world.tscn --quit-after 3 2>&1 | tee /tmp/hashrace-world.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-world.log; then exit 1; fi
      - name: Validate selected-company transition and playable town loop
        run: godot --headless --path Godot --script res://scripts/validate_overworld.gd
      - name: Install virtual display for real rendered-frame proof
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y xvfb; fi
      - name: Capture and validate gameplay screenshot
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path Godot --rendering-method gl_compatibility --script res://scripts/capture_screenshot.gd 2>&1 | tee /tmp/hashrace-visual.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|SCREENSHOT CAPTURE FAIL" /tmp/hashrace-visual.log; then exit 1; fi
          test -s visual-proof/hashrace-screenshot.png
      - name: Render and validate close-up 2D detail frame
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path Godot --rendering-method gl_compatibility --script res://scripts/capture_2d_detail.gd 2>&1 | tee /tmp/hashrace-2d-detail.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|2D DETAIL PROOF FAIL" /tmp/hashrace-2d-detail.log; then exit 1; fi
          test -s visual-proof/hashrace-2d-detail.png
      - name: Render and validate live Mining Ops widget proof
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path Godot --rendering-method gl_compatibility --script res://scripts/capture_mining_ops_widget.gd 2>&1 | tee /tmp/hashrace-mining-ops-widget.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|MINING OPS WIDGET PROOF FAIL" /tmp/hashrace-mining-ops-widget.log; then exit 1; fi
          test -s visual-proof/hashrace-mining-ops-widget.png
      - name: Render and validate negotiation scene proof
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path Godot --rendering-method gl_compatibility --script res://scripts/capture_negotiation_scene.gd 2>&1 | tee /tmp/hashrace-negotiation-proof.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|HASH RACE NEGOTIATION PROOF FAIL" /tmp/hashrace-negotiation-proof.log; then exit 1; fi
          test -s visual-proof/hashrace-negotiation-scene.png
      - name: Upload gameplay screenshot
        uses: actions/upload-artifact@v4
        with:
          name: hashrace-gameplay-screenshot
          path: visual-proof/hashrace-screenshot.png
          if-no-files-found: error
      - name: Upload close-up 2D detail proof
        uses: actions/upload-artifact@v4
        with:
          name: hashrace-2d-detail-visual-proof
          path: visual-proof/hashrace-2d-detail.png
          if-no-files-found: error
      - name: Upload Mining Ops widget proof
        uses: actions/upload-artifact@v4
        with:
          name: hashrace-mining-ops-widget-proof
          path: visual-proof/hashrace-mining-ops-widget.png
          if-no-files-found: error
      - name: Upload negotiation scene proof
        uses: actions/upload-artifact@v4
        with:
          name: hashrace-negotiation-scene-proof
          path: visual-proof/hashrace-negotiation-scene.png
          if-no-files-found: error

  python-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test the core mining and concept contract
        run: python tools/smoke_test.py
      - name: Test the ten-miner league standings contract
        run: python tools/test_league_contract.py
      - name: Test the life and operations contract
        run: python tools/test_life_ops_contract.py
      - name: Test energy deployment and visual contract
        run: python tools/test_energy_visual_contract.py
      - name: Test compact consolidated Mining Ops widget contract
        run: python tools/test_mining_ops_widget_contract.py
      - name: Test v0.090 runtime polish and visual readability contract
        run: python tools/test_runtime_polish_contract.py
      - name: Test v0.090 strategy, finite power and rival-intent contract
        run: python tools/test_strategy_power_ai_contract.py
      - name: Test v0.091 interaction-quality contract
        run: python tools/test_v091_interaction_quality.py
      - name: Test v0.093 start preview and UI cleanup contract
        run: python tools/test_v093_start_ui_contract.py
      - name: Test v0.102 overworld visual cleanup contract
        run: python tools/test_v102_visual_cleanup_contract.py
      - name: Test v0.103 intentional-world composition contract
        run: python tools/test_v103_composition_contract.py
      - name: Test v0.107 pixel-world composition contract
        run: python tools/test_v107_visual_composition_contract.py
      - name: Test v0.070 modular architecture contract
        run: python tools/test_modular_architecture_contract.py
      - name: Test v0.072 negotiation scene contract
        run: python tools/test_negotiation_contract.py
      - name: Test pixel landscape and compact UI contract
        run: python tools/test_pixel_landscape_ui_contract.py
      - name: Test v0.088 world scale and transition contract
        run: python tools/test_world_transition_contract.py

  cpp-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4
      - name: Compile C++ simulation, inventory, catalogs and core checks
        run: >-
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic
          native/cpp/hashrace_catalog.cpp
          native/cpp/hashrace_simulation.cpp
          native/cpp/hashrace_core.cpp
          -o /tmp/hashrace_cpp
      - name: Run C++ simulation checks
        run: /tmp/hashrace_cpp

  rust-balance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4
      - name: Run Rust balance unit tests
        run: rustc --edition=2021 --test native/rust/hashrace_balance.rs -o /tmp/hashrace_rust_tests && /tmp/hashrace_rust_tests
      - name: Run Rust one-year balance probe
        run: rustc --edition=2021 native/rust/hashrace_balance.rs -o /tmp/hashrace_rust && /tmp/hashrace_rust

  typescript-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript compiler
        run: npm install --no-save typescript@5.8.3
      - name: Compile TypeScript content validator
        run: npx tsc tools/typescript/hashrace_validate.ts --target ES2020 --module commonjs --strict --outDir .tmp-ts
      - name: Validate Hash Race content contract
        run: node .tmp-ts/hashrace_validate.js
