name: Hash Race multi-language smoke test

on:
  push:
  pull_request:

jobs:
  godot-world-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4
      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Boot opening campaign setup with strict script-error gate
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path Godot --quit-after 3 2>&1 | tee /tmp/hashrace-setup.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-setup.log; then exit 1; fi
      - name: Boot real company town network with strict script-error gate
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path Godot res://scenes/world.tscn --quit-after 3 2>&1 | tee /tmp/hashrace-world.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-world.log; then exit 1; fi
      - name: Validate selected-company transition and playable town loop
        run: godot --headless --path Godot --script res://scripts/validate_overworld.gd
      - name: Install virtual display for real rendered-frame proof
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y xvfb; fi
      - name: Render and validate actual company-town frame
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path Godot --rendering-method gl_compatibility --script res://scripts/capture_overworld.gd 2>&1 | tee /tmp/hashrace-visual.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|VISUAL PROOF FAIL" /tmp/hashrace-visual.log; then exit 1; fi
          test -s visual-proof/hashrace-overworld.png
      - name: Upload actual rendered game frame
        uses: actions/upload-artifact@v4
        with:
          name: hashrace-overworld-visual-proof
          path: visual-proof/hashrace-overworld.png
          if-no-files-found: error

  python-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test the core mining and concept contract
        run: python tools/smoke_test.py
      - name: Test the ten-miner league standings contract
        run: python tools/test_league_contract.py
      - name: Test the life and operations contract
        run: python tools/test_life_ops_contract.py

  cpp-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4
      - name: Compile C++ mining core
        run: g++ -std=c++20 -Wall -Wextra -pedantic native/cpp/hashrace_core.cpp -o /tmp/hashrace_cpp
      - name: Run C++ mining core checks
        run: /tmp/hashrace_cpp

  rust-balance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4
      - name: Run Rust balance unit tests
        run: rustc --edition=2021 --test native/rust/hashrace_balance.rs -o /tmp/hashrace_rust_tests && /tmp/hashrace_rust_tests
      - name: Run Rust one-year balance probe
        run: rustc --edition=2021 native/rust/hashrace_balance.rs -o /tmp/hashrace_rust && /tmp/hashrace_rust

  typescript-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript compiler
        run: npm install --no-save typescript@5.8.3
      - name: Compile TypeScript content validator
        run: npx tsc tools/typescript/hashrace_validate.ts --target ES2020 --module commonjs --strict --outDir .tmp-ts
      - name: Validate Hash Race content contract
        run: node .tmp-ts/hashrace_validate.js
