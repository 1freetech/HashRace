name: Hash Race multi-language smoke test

on:
  push:
  pull_request:

jobs:
  godot-world-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Boot opening campaign setup with strict script-error gate
        run: |
          set -euo pipefail
          godot --headless --path Godot --quit-after 3 2>&1 | tee /tmp/hashrace-setup.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-setup.log; then exit 1; fi
      - name: Validate live campaign character preview
        run: godot --headless --path Godot --script res://scripts/validate_campaign_setup.gd
      - name: Boot real company town network with strict script-error gate
        run: |
          set -euo pipefail
          godot --headless --path Godot res://scenes/world.tscn --quit-after 3 2>&1 | tee /tmp/hashrace-world.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-world.log; then exit 1; fi
      - name: Validate selected-company transition and playable town loop
        run: godot --headless --path Godot --script res://scripts/validate_overworld.gd

  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/smoke_test.py
      - run: python tools/test_league_contract.py
      - run: python tools/test_life_ops_contract.py
      - run: python tools/test_energy_visual_contract.py
      - run: python tools/test_mining_ops_widget_contract.py
      - run: python tools/test_runtime_polish_contract.py
      - run: python tools/test_strategy_power_ai_contract.py
      - run: python tools/test_v091_interaction_quality.py
      - run: python tools/test_v093_start_ui_contract.py
      - run: python tools/test_v102_visual_cleanup_contract.py
      - run: python tools/test_v103_composition_contract.py
      - run: python tools/test_v107_visual_composition_contract.py
      - run: python tools/test_v109_navigation_contract.py
      - run: python tools/test_modular_architecture_contract.py
      - run: python tools/test_negotiation_contract.py
      - run: python tools/test_pixel_landscape_ui_contract.py
      - run: python tools/test_world_transition_contract.py

  cpp-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run C++ checks
        run: g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic native/cpp/hashrace_catalog.cpp native/cpp/hashrace_simulation.cpp native/cpp/hashrace_core.cpp -o /tmp/hashrace_cpp && /tmp/hashrace_cpp

  rust-balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustc --edition=2021 --test native/rust/hashrace_balance.rs -o /tmp/hashrace_rust_tests && /tmp/hashrace_rust_tests
      - run: rustc --edition=2021 native/rust/hashrace_balance.rs -o /tmp/hashrace_rust && /tmp/hashrace_rust

  typescript-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save typescript@5.8.3
      - run: npx tsc tools/typescript/hashrace_validate.ts --target ES2020 --module commonjs --strict --outDir .tmp-ts
      - run: node .tmp-ts/hashrace_validate.js
