name: Hash Race multi-language smoke test

on:
  push:
  pull_request:

jobs:
  godot-world-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Parse modular scripts
        run: godot --headless --path Godot --script res://scripts/validate_modular_scripts.gd
      - name: Boot playable world
        run: godot --headless --path Godot res://scenes/world.tscn --quit-after 3
      - name: Validate overworld
        run: godot --headless --path Godot --script res://scripts/validate_overworld.gd

  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Core mining contract
        run: python tools/smoke_test.py
      - name: Ten-miner league contract
        run: python tools/test_league_contract.py
      - name: Life and operations contract
        run: python tools/test_life_ops_contract.py
      - name: Energy visual contract
        run: python tools/test_energy_visual_contract.py
      - name: v0.125 dirt-road contract
        run: python tools/test_v125_dirt_road_contract.py
      - name: v0.126 live capacity feedback contract
        run: python tools/test_v126_capacity_feedback_contract.py

  cpp-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run C++ core
        run: g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic native/cpp/hashrace_catalog.cpp native/cpp/hashrace_simulation.cpp native/cpp/hashrace_core.cpp -o /tmp/hashrace_cpp && /tmp/hashrace_cpp

  rust-balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Rust balance tests
        run: rustc --edition=2021 --test native/rust/hashrace_balance.rs -o /tmp/hashrace_rust_tests && /tmp/hashrace_rust_tests

  typescript-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save typescript@5.8.3
      - run: npx tsc tools/typescript/hashrace_validate.ts --target ES2020 --module commonjs --strict --outDir .tmp-ts && node .tmp-ts/hashrace_validate.js
