name: Hash Race Godot Desktop Release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - '.github/workflows/desktop-release.yml'
      - 'Godot/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - preset: Windows Desktop
            platform: windows-x64
            export_path: build/windows/HashRace.exe
            package_name: windows-x64.zip
          - preset: Linux
            platform: linux-x64
            export_path: build/linux/HashRace.x86_64
            package_name: linux-x64.tar.gz
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4

      - name: Set up Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Strictly verify source game and town network
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path Godot --quit-after 3 2>&1 | tee /tmp/hashrace-release-source.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-release-source.log; then
            echo "Source game emitted a Godot script error."
            exit 1
          fi
          godot --headless --path Godot res://scenes/world.tscn --quit-after 3 2>&1 | tee /tmp/hashrace-release-world.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-release-world.log; then
            echo "Town network emitted a Godot script error."
            exit 1
          fi
          godot --headless --path Godot --script res://scripts/validate_overworld.gd

      - name: Install virtual display for rendered release proof
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Render and validate actual release frame
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path Godot --rendering-method gl_compatibility --script res://scripts/capture_overworld.gd 2>&1 | tee /tmp/hashrace-release-visual.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|VISUAL PROOF FAIL" /tmp/hashrace-release-visual.log; then
            echo "Rendered release proof failed."
            exit 1
          fi
          test -s visual-proof/hashrace-overworld.png

      - name: Export current Godot game
        shell: bash
        run: |
          EXPORT_PATH="$GITHUB_WORKSPACE/${{ matrix.export_path }}"
          mkdir -p "$(dirname "$EXPORT_PATH")"
          godot --headless --path Godot --export-release "${{ matrix.preset }}" "$EXPORT_PATH"

      - name: Verify exported Linux build boots
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/linux/HashRace.x86_64
          build/linux/HashRace.x86_64 --headless --quit-after 3 2>&1 | tee /tmp/hashrace-exported-linux.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-exported-linux.log; then
            echo "Exported Linux build emitted a Godot script error."
            exit 1
          fi

      - name: Package Windows build
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          cd build/windows
          zip -j "../../HashRace-${VERSION}-windows-x64.zip" HashRace.exe

      - name: Package Linux build
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          chmod +x build/linux/HashRace.x86_64
          tar -czf "HashRace-${VERSION}-linux-x64.tar.gz" -C build/linux HashRace.x86_64

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: HashRace-${{ steps.version.outputs.value }}-${{ matrix.platform }}
          path: HashRace-${{ steps.version.outputs.value }}-${{ matrix.package_name }}
          if-no-files-found: error

      - name: Upload rendered game preview
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: HashRace-${{ steps.version.outputs.value }}-visual-proof
          path: visual-proof/hashrace-overworld.png
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download packaged builds and rendered preview
        uses: actions/download-artifact@v4
        with:
          pattern: HashRace-${{ steps.version.outputs.value }}-*
          path: release
          merge-multiple: true

      - name: Point release tag at this tested Godot build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION" --force

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lah release
          NOTES="Hash Race $VERSION is the first release gated by an actual rendered-frame proof. After choosing a mining company and 1-20 year campaign clock, the game now enters a visible futuristic top-down company world instead of a blank gray screen. The ten fictional mining competitors are VantaGrid Mining, NeonForge Mining, ArcShift Mining, IronVector Mining, Meridian Zero Mining, BlueNova Mining, SignalFlux Mining, Parallax Core Mining, LatticeX Mining, and Epoch Vector Mining. Each has its own named town, HQ and representative wearing original techwear with a left- or right-eye scanner visor. Walk with WASD/arrows, talk with E/Enter, use Town Transit with T, visit rival reps and partner firms, buy ASICs, land and MW, change energy, finance growth from Local Joker Bank upward, negotiate partner boosts, manage cooling/chips/treasury, attempt one merger, and end quarters to advance the Bitcoin/Fed/land/energy market. The release includes the actual CI-rendered overworld PNG used to prove the game is not blank."
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" release/* --clobber
            gh release edit "$VERSION" --title "Hash Race $VERSION" --notes "$NOTES" --latest
          else
            gh release create "$VERSION" release/* --target "$GITHUB_SHA" --title "Hash Race $VERSION" --notes "$NOTES" --latest
          fi
