name: Hash Race v0.165 PR94 Playtest

on:
  push:
    branches:
      - 'playtest/v0.165-pr94'
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'VERSION'
      - 'Godot/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out playtest branch
        uses: actions/checkout@v4

      - name: Assert v0.165 source version
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "v0.165"
          git rev-parse HEAD

      - name: Set up Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Fresh import and source validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Godot/.godot
          godot --headless --path Godot --editor --import 2>&1 | tee /tmp/hashrace-v165-import.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/hashrace-v165-import.log; then exit 1; fi
          godot --headless --path Godot --script res://scripts/validate_player_sprite.gd 2>&1 | tee /tmp/hashrace-v165-player.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:|PLAYER VALIDATION FAIL" /tmp/hashrace-v165-player.log; then exit 1; fi
          godot --headless --path Godot --quit-after 3 2>&1 | tee /tmp/hashrace-v165-boot.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-v165-boot.log; then exit 1; fi
          godot --headless --path Godot res://scenes/world.tscn --quit-after 3 2>&1 | tee /tmp/hashrace-v165-world.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-v165-world.log; then exit 1; fi
          godot --headless --path Godot --script res://scripts/validate_overworld.gd
          godot --headless --path Godot --script res://scripts/validate_negotiation_scene.gd

      - name: Render fresh v0.165 diesel gameplay proof
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          mkdir -p visual-proof
          cd Godot
          timeout 90s xvfb-run -a godot --audio-driver Dummy --path . --script res://scripts/capture_v165_diesel.gd 2>&1 | tee /tmp/hashrace-v165-diesel.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/hashrace-v165-diesel.log; then exit 1; fi
          grep -q "V165 DIESEL PROOF PASS" /tmp/hashrace-v165-diesel.log
          test -s ../visual-proof/v165-diesel-overview.png

      - name: Export Windows playtest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows
          godot --headless --path Godot --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/windows/HashRace.exe"
          test -s build/windows/HashRace.exe

      - name: Package Windows playtest
        shell: bash
        run: |
          set -euo pipefail
          cd build/windows
          zip -j "$GITHUB_WORKSPACE/HashRace-v0.165-windows-x64.zip" HashRace.exe
          test -s "$GITHUB_WORKSPACE/HashRace-v0.165-windows-x64.zip"

      - name: Upload Windows playtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: HashRace-v0.165-windows-x64
          path: HashRace-v0.165-windows-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload exact-run diesel proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: HashRace-v0.165-pr94-diesel-proof
          path: visual-proof/v165-diesel-overview.png
          if-no-files-found: error
          retention-days: 90

      - name: Publish v0.165 PR94 playtest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.165-playtest-pr94
        shell: bash
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          Hash Race v0.165 PR #94 playtest build.

          Game source is the PR #94 state based on fb2f8d9538bbbee46366c95bb9613470b03d683f; this playtest branch adds only the packaging workflow needed to export the executable.

          Validation performed in this release run:
          - fresh Godot 4.7.2 import
          - player sprite validation
          - source and world boot checks
          - overworld and negotiation validators
          - fresh v0.165 diesel gameplay render proof
          - Windows Desktop release export

          This is a prerelease playtest, not the final merged release.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" HashRace-v0.165-windows-x64.zip visual-proof/v165-diesel-overview.png --clobber
            gh release edit "$TAG" --title "Hash Race v0.165 PR #94 Playtest" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" HashRace-v0.165-windows-x64.zip visual-proof/v165-diesel-overview.png --target "$GITHUB_SHA" --title "Hash Race v0.165 PR #94 Playtest" --notes "$NOTES" --prerelease
          fi
