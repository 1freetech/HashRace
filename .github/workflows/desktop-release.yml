name: Hash Race Godot Desktop Release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - preset: Windows Desktop
            platform: windows-x64
            export_path: build/windows/HashRace.exe
            package_name: windows-x64.zip
          - preset: Linux
            platform: linux-x64
            export_path: build/linux/HashRace.x86_64
            package_name: linux-x64.tar.gz
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4

      - name: Set up Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Verify current Godot game boots
        shell: bash
        run: godot --headless --path Godot --quit-after 3

      - name: Export current Godot game
        shell: bash
        run: |
          EXPORT_PATH="$GITHUB_WORKSPACE/${{ matrix.export_path }}"
          mkdir -p "$(dirname "$EXPORT_PATH")"
          godot --headless --path Godot --export-release "${{ matrix.preset }}" "$EXPORT_PATH"

      - name: Package Windows build
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          cd build/windows
          zip -j "../../HashRace-${VERSION}-windows-x64.zip" HashRace.exe

      - name: Package Linux build
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          chmod +x build/linux/HashRace.x86_64
          tar -czf "HashRace-${VERSION}-linux-x64.tar.gz" -C build/linux HashRace.x86_64

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: HashRace-${{ steps.version.outputs.value }}-${{ matrix.platform }}
          path: HashRace-${{ steps.version.outputs.value }}-${{ matrix.package_name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          pattern: HashRace-${{ steps.version.outputs.value }}-*
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lah release
          NOTES="Current Godot Hash Race build with the interactive Bitcoin mining tech-town world, selectable campaign clock from 1 year/4 turns through 20 years/80 turns, quarterly turns with a cash preview and confirmation before advancing, 16-turn halvings, unique company starting strengths, machines/MW/land/energy/cooling/chip progression, NPC partnerships, hosting, asset-backed bank and government financing, debt repayment, and final campaign standings."
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" release/* --clobber
            gh release edit "$VERSION" --title "Hash Race $VERSION" --notes "$NOTES"
          else
            gh release create "$VERSION" release/* --target "$GITHUB_SHA" --title "Hash Race $VERSION" --notes "$NOTES"
          fi
