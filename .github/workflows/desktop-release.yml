name: Hash Race Godot Desktop Release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - '.github/workflows/desktop-release.yml'
      - 'Godot/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - preset: Windows Desktop
            platform: windows-x64
            export_path: build/windows/HashRace.exe
            package_name: windows-x64.zip
          - preset: Linux
            platform: linux-x64
            export_path: build/linux/HashRace.x86_64
            package_name: linux-x64.tar.gz
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4

      - name: Set up Godot 4.7.2 with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Strictly verify source game and town network
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path Godot --quit-after 3 2>&1 | tee /tmp/hashrace-release-source.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-release-source.log; then
            echo "Source game emitted a Godot script error."
            exit 1
          fi
          godot --headless --path Godot res://scenes/world.tscn --quit-after 3 2>&1 | tee /tmp/hashrace-release-world.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-release-world.log; then
            echo "Town network emitted a Godot script error."
            exit 1
          fi
          godot --headless --path Godot --script res://scripts/validate_overworld.gd
          godot --headless --path Godot --script res://scripts/validate_negotiation_scene.gd

      - name: Install virtual display for rendered release proof
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Capture and validate release screenshot
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path Godot --rendering-method gl_compatibility --script res://scripts/capture_screenshot.gd 2>&1 | tee /tmp/hashrace-release-visual.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|SCREENSHOT CAPTURE FAIL" /tmp/hashrace-release-visual.log; then
            echo "Release screenshot capture failed."
            exit 1
          fi
          test -s visual-proof/hashrace-screenshot.png

      - name: Render and validate close-up 2D detail proof
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path Godot --rendering-method gl_compatibility --script res://scripts/capture_2d_detail.gd 2>&1 | tee /tmp/hashrace-release-2d-detail.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|2D DETAIL PROOF FAIL" /tmp/hashrace-release-2d-detail.log; then
            echo "Rendered 2D detail proof failed."
            exit 1
          fi
          test -s visual-proof/hashrace-2d-detail.png

      - name: Render and validate live Mining Ops widget proof
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path Godot --rendering-method gl_compatibility --script res://scripts/capture_mining_ops_widget.gd 2>&1 | tee /tmp/hashrace-release-mining-ops-widget.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|MINING OPS WIDGET PROOF FAIL" /tmp/hashrace-release-mining-ops-widget.log; then
            echo "Rendered Mining Ops widget proof failed."
            exit 1
          fi
          test -s visual-proof/hashrace-mining-ops-widget.png

      - name: Render and validate negotiation scene proof
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path Godot --rendering-method gl_compatibility --script res://scripts/capture_negotiation_scene.gd 2>&1 | tee /tmp/hashrace-release-negotiation.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|HASH RACE NEGOTIATION PROOF FAIL" /tmp/hashrace-release-negotiation.log; then
            echo "Rendered negotiation proof failed."
            exit 1
          fi
          test -s visual-proof/hashrace-negotiation-scene.png

      - name: Export current Godot game
        shell: bash
        run: |
          EXPORT_PATH="$GITHUB_WORKSPACE/${{ matrix.export_path }}"
          mkdir -p "$(dirname "$EXPORT_PATH")"
          godot --headless --path Godot --export-release "${{ matrix.preset }}" "$EXPORT_PATH"

      - name: Verify exported Linux build boots
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/linux/HashRace.x86_64
          build/linux/HashRace.x86_64 --headless --quit-after 3 2>&1 | tee /tmp/hashrace-exported-linux.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/hashrace-exported-linux.log; then
            echo "Exported Linux build emitted a Godot script error."
            exit 1
          fi

      - name: Package Windows build
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          cd build/windows
          zip -j "../../HashRace-${VERSION}-windows-x64.zip" HashRace.exe

      - name: Package Linux build
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          chmod +x build/linux/HashRace.x86_64
          tar -czf "HashRace-${VERSION}-linux-x64.tar.gz" -C build/linux HashRace.x86_64

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: HashRace-${{ steps.version.outputs.value }}-${{ matrix.platform }}
          path: HashRace-${{ steps.version.outputs.value }}-${{ matrix.package_name }}
          if-no-files-found: error

      - name: Upload release screenshots and visual checks
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: HashRace-${{ steps.version.outputs.value }}-screenshots
          path: |
            visual-proof/hashrace-screenshot.png
            visual-proof/hashrace-2d-detail.png
            visual-proof/hashrace-mining-ops-widget.png
            visual-proof/hashrace-negotiation-scene.png
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download packaged builds and rendered previews
        uses: actions/download-artifact@v4
        with:
          pattern: HashRace-${{ steps.version.outputs.value }}-*
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lah release
          SCREENSHOT_URL="https://github.com/${{ github.repository }}/releases/download/$VERSION/hashrace-screenshot.png"
          NOTES=$(cat <<EOF
          Hash Race $VERSION

          This release includes the current Windows and Linux builds plus a fresh screenshot captured directly from the running Godot game.

          ## Downloads

          - [Windows x64](https://github.com/${{ github.repository }}/releases/download/$VERSION/HashRace-$VERSION-windows-x64.zip)
          - [Linux x64](https://github.com/${{ github.repository }}/releases/download/$VERSION/HashRace-$VERSION-linux-x64.tar.gz)

          ## Screenshot

          ![Hash Race gameplay screenshot]($SCREENSHOT_URL)

          The screenshot is generated during the release workflow and the release fails if a valid gameplay image is not produced.
          EOF
          )
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" release/* --clobber
            gh release edit "$VERSION" --title "Hash Race $VERSION" --notes "$NOTES" --latest
          else
            gh release create "$VERSION" release/* --target "$GITHUB_SHA" --title "Hash Race $VERSION" --notes "$NOTES" --latest
          fi