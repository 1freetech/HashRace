name: Hash Race Desktop Release

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'VERSION'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64]
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained game
        shell: bash
        run: >-
          dotnet publish desktop/HashRace.Desktop/HashRace.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/${{ matrix.rid }}

      - name: Package Windows build
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          cd publish/win-x64
          zip -j "../../HashRace-${VERSION}-windows-x64.zip" HashRace.exe

      - name: Package Linux build
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          chmod +x publish/linux-x64/HashRace
          tar -czf "HashRace-${VERSION}-linux-x64.tar.gz" -C publish/linux-x64 HashRace

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: HashRace-${{ steps.version.outputs.value }}-${{ matrix.rid }}
          path: HashRace-${{ steps.version.outputs.value }}-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hash Race
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          pattern: HashRace-${{ steps.version.outputs.value }}-*
          path: release
          merge-multiple: true

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lah release
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" release/* --clobber
          else
            gh release create "$VERSION" release/* \
              --target "$GITHUB_SHA" \
              --title "Hash Race $VERSION" \
              --notes "Playable Hash Race desktop prototype. Windows and Linux builds are self-contained. This early version focuses on the company race, ASIC evolution, facilities, partnerships, league standings, R&D, acquisitions, and mining economics."
          fi
