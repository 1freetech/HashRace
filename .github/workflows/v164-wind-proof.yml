name: v0.164 exact-head wind proof

on:
  push:
    branches: [automation/v164-wind-forward-port]
  pull_request:
    branches: [main]

jobs:
  wind-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact proposed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          echo "exact-head=$EXPECTED"
      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Validate real wind PNG binary and live wiring
        run: python tools/test_v164_wind_asset.py
      - name: Fresh Godot import and decode
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Godot/.godot
          godot --headless --path Godot --editor --import 2>&1 | tee /tmp/v164-import.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/v164-import.log; then exit 1; fi
      - name: Install virtual display
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y xvfb; fi
      - name: Render actual deployed wind_farm gameplay proof
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a godot --path Godot --rendering-method gl_compatibility --script res://scripts/capture_v164_wind.gd 2>&1 | tee /tmp/v164-wind.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|V164 WIND PROOF FAIL" /tmp/v164-wind.log; then exit 1; fi
          grep -q "V164 WIND PROOF PASS" /tmp/v164-wind.log
          test -s visual-proof/v164-wind-overview.png
      - name: Upload exact-head wind screenshot
        uses: actions/upload-artifact@v4
        with:
          name: hashrace-v164-live-wind-proof
          path: visual-proof/v164-wind-overview.png
          if-no-files-found: error
