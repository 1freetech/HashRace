name: Gameplay proof
on:
  push:
  pull_request:
    branches: [main]
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Fresh import
        run: |
          rm -rf Godot/.godot
          cd Godot
          timeout 90s godot --headless --editor --path . --quit-after 2
      - name: Runtime screenshot
        run: |
          mkdir -p visual-proof
          cd Godot
          xvfb-run -a godot --path . --script res://scripts/gameplay_capture.gd
          test -s ../visual-proof/gameplay.png
      - uses: actions/upload-artifact@v4
        with:
          name: hashrace-gameplay
          path: visual-proof/gameplay.png
