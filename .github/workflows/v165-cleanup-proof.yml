name: v0.165 cleanup proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [automation/energy-collision-npc-identity-20261006]

jobs:
  cleanup-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate cleanup source contract
        run: python tools/test_v165_cleanup_contract.py
      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Fresh import
        run: |
          set -euo pipefail
          rm -rf Godot/.godot
          cd Godot
          timeout 120s godot --headless --editor --path . --import 2>&1 | tee /tmp/v165-cleanup-import.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/v165-cleanup-import.log; then exit 1; fi
      - name: Render distinct NPC proof
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          mkdir -p visual-proof
          timeout 90s xvfb-run -a godot --audio-driver Dummy --path Godot --rendering-method gl_compatibility --script res://scripts/capture_v165_cleanup.gd 2>&1 | tee /tmp/v165-cleanup-proof.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:|V165 CLEANUP PROOF FAIL" /tmp/v165-cleanup-proof.log; then exit 1; fi
          grep -q "V165 CLEANUP PROOF PASS" /tmp/v165-cleanup-proof.log
          test -s visual-proof/v165-npc-identity.png
      - uses: actions/upload-artifact@v4
        with:
          name: hashrace-v165-cleanup-proof
          path: visual-proof/v165-npc-identity.png
          if-no-files-found: error
