name: v0.165 diesel gameplay proof
on:
  push:
    branches: [automation/v164-wind-forward-port]
  pull_request:
    branches: [main]
jobs:
  diesel-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Fresh Godot import
        run: |
          rm -rf Godot/.godot
          cd Godot
          timeout 90s godot --headless --editor --path . --quit-after 2
      - name: Render actual diesel gameplay proof
        run: |
          mkdir -p visual-proof
          cd Godot
          xvfb-run -a godot --path . --script res://scripts/capture_v165_diesel.gd
          test -s ../visual-proof/v165-diesel-overview.png
      - uses: actions/upload-artifact@v4
        with:
          name: hashrace-v165-live-diesel-proof
          path: visual-proof/v165-diesel-overview.png
